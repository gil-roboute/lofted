# Mosquitto config for Loftie local control — mutual-TLS only, no anonymous.
# Pairs with the EC chain from ../gen_certs.py and the cert slots patched into
# the firmware by ../may-firmware-dump/patch_this.py.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
log_type notice

# TLS listener. The clock connects by IP (mqtts://<host-ip>:8883); the server
# cert below MUST carry that IP as a subjectAltName (gen_certs.py does this).
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Mutual TLS: every client must present a cert signed by our CA. The clock
# presents client.crt (CN=AlarmClock); Home Assistant presents ha.crt
# (CN=home-assistant). The CN becomes the username that the ACL below keys on.
require_certificate true
use_identity_as_username true

# Per-identity topic permissions (default deny). See ./acl.
acl_file /mosquitto/config/acl

# No unauthenticated access.
allow_anonymous false
